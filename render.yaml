services:
  - type: web
    name: highway-ai-chat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: HIGHWAY_API_KEY
        sync: false
      - key: HIGHWAY_BASE_URL
        value: https://api.highwayapi.ai/openai/v1
      - key: HIGHWAY_MODEL
        value: gpt-6-astra
      - key: MAX_UPLOAD_MB
        value: "25"
