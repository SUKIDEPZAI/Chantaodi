<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>MộtAPI AI Chat</title><style>
:root{color-scheme:dark;--line:#26334f;--text:#eef3ff;--muted:#9ba9c7;--accent:#8b9cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172447,#0b1020 55%);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif;height:100dvh}.app{height:100dvh;max-width:1180px;margin:auto;display:flex;flex-direction:column;padding:10px;gap:10px}header,.composer,#chat{border:1px solid var(--line);background:#111a2ee8;border-radius:17px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px}.brand{font-weight:850;font-size:18px}.sub,.hint,.model-note{font-size:11px;color:var(--muted)}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}select{max-width:min(55vw,340px);background:#0d162a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}#status{font-size:12px;color:#8ce7b4}#chat{flex:1;min-height:0;overflow:auto;background:#0e1629c9;padding:18px;display:flex;flex-direction:column;gap:14px}.welcome{margin:auto;text-align:center;max-width:620px;color:var(--muted)}.welcome h1{color:var(--text);font-size:clamp(24px,5vw,36px);margin:0 0 8px}.msg{max-width:min(88%,820px);padding:12px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.user{align-self:flex-end;background:#263d72;border:1px solid #3b5897}.assistant{align-self:flex-start;background:#151f35;border:1px solid var(--line)}.label{font-size:11px;color:#aebde0;margin-bottom:5px;display:flex;justify-content:space-between;gap:12px}#attachments{display:flex;gap:7px;flex-wrap:wrap}.filechip{font-size:12px;background:#202c45;border:1px solid var(--line);padding:5px 8px;border-radius:10px;display:flex;align-items:center;gap:5px}.composer{padding:11px}#prompt{width:100%;resize:vertical;min-height:58px;max-height:180px;background:transparent;color:var(--text);border:0;outline:0;font:inherit}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}button,.upload{border:1px solid var(--line);background:#1b2944;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;font:inherit}button.primary{background:var(--accent);color:#081127;border-color:transparent;font-weight:800}button:disabled{opacity:.5;cursor:wait}.hint{margin-left:auto}#fileInput{display:none}.error{color:#ffb4b4}.model-note{padding-top:7px}@media(max-width:650px){.app{padding:6px}header{align-items:flex-start;flex-direction:column}.top{width:100%}.top label{flex:1;min-width:0}.top select{width:100%;max-width:none}.msg{max-width:96%}.hint{width:100%;margin:0}}
</style></head><body><main class="app"><header><div><div class="brand">✦ MộtAPI AI Chat</div><div class="sub">Một endpoint · Nhiều model · Phản hồi trực tuyến</div></div><div class="top"><label for="modelSelect" class="sub">Model<br><select id="modelSelect"></select></label><div id="status">Đang kết nối…</div></div></header><section id="chat" aria-live="polite"><div class="welcome"><h1>Xin chào 👋</h1><div>Chọn model rồi bắt đầu trò chuyện. Bạn có thể đính kèm nhiều tệp hoặc ảnh.</div></div></section><div id="attachments"></div><section class="composer"><textarea id="prompt" placeholder="Nhắn tin cho AI… (Enter để gửi, Shift+Enter xuống dòng)"></textarea><div class="tools"><label class="upload" for="fileInput">＋ Tệp / ảnh</label><input id="fileInput" type="file" multiple><button id="clearBtn">Chat mới</button><button id="stopBtn" disabled>Dừng</button><span class="hint">API key chỉ lưu trên Render.</span><button id="sendBtn" class="primary">Gửi ↑</button></div><div class="model-note">Mặc định tối đa 25 MB mỗi yêu cầu. Model cần được MộtAPI cấp quyền và hỗ trợ loại nội dung gửi.</div></section></main><script>
const models=['DeepSeek-V4-Flash-0731','claude-sonnet-4-6','claude-sonnet-5','claude-sonnet-5-5','deepseek-v4-flash','glm-5.3-flash','gpt-5.6-sol','gpt-6-astra','gpt-6-luna','gpt-6-sol','grok-4.5','grok-4.6','hy3','hy4-preview','minimax-m2.7','minimax-m3','qwen3.8-max'];const $=s=>document.querySelector(s),chat=$('#chat'),prompt=$('#prompt'),fileInput=$('#fileInput'),attachments=$('#attachments'),sendBtn=$('#sendBtn'),stopBtn=$('#stopBtn'),status=$('#status'),select=$('#modelSelect');let files=[],history=[],controller=null;
function add(role,text,selected=[]){$('.welcome')?.remove();const box=document.createElement('div');box.className='msg '+role;const label=document.createElement('div');label.className='label';const who=document.createElement('span');who.textContent=role==='user'?'Bạn':'MộtAPI AI';const mdl=document.createElement('span');mdl.textContent=role==='assistant'?select.value:'';label.append(who,mdl);const body=document.createElement('div');body.textContent=text;box.append(label,body);if(selected.length){const f=document.createElement('div');f.className='label';f.style.marginTop='8px';f.textContent='Đính kèm: '+selected.map(x=>x.name).join(', ');box.append(f)}chat.append(box);chat.scrollTop=chat.scrollHeight;return {box,body}}
function renderFiles(){attachments.replaceChildren();files.forEach((f,i)=>{const chip=document.createElement('span');chip.className='filechip';const n=document.createElement('span');n.textContent='📎 '+f.name;const b=document.createElement('button');b.textContent='×';b.onclick=()=>{files.splice(i,1);renderFiles()};chip.append(n,b);attachments.append(chip)})}fileInput.onchange=()=>{files.push(...fileInput.files);renderFiles();fileInput.value=''};
async function check(){try{const r=await fetch('/api/health'),d=await r.json();status.textContent=d.configured?'Máy chủ sẵn sàng':'Thiếu API key';if(!d.configured)status.style.color='#ffb4b4'}catch{status.textContent='Không kết nối';status.style.color='#ffb4b4'}}async function loadModels(){try{const r=await fetch('/api/models'),d=await r.json(),list=(d.models||[]).map(x=>typeof x==='string'?x:x.id).filter(Boolean);fill(list.length?list:models)}catch{fill(models)}}function fill(list){select.replaceChildren();list.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=id;select.append(o)});select.value=list.includes('gpt-6-astra')?'gpt-6-astra':list[0]}
async function send(){const text=prompt.value.trim();if(!text&&!files.length)return;const chosen=files.slice(),model=select.value;add('user',text||'(Đã gửi tệp)',chosen);prompt.value='';files=[];renderFiles();sendBtn.disabled=true;stopBtn.disabled=false;sendBtn.textContent='Đang trả lời…';controller=new AbortController();const answer=add('assistant','');let full='';try{const fd=new FormData();fd.append('message',text);fd.append('model',model);fd.append('history',JSON.stringify(history.slice(-16)));chosen.forEach(f=>fd.append('files',f));const res=await fetch('/api/chat',{method:'POST',body:fd,signal:controller.signal});if(!res.ok){let d={};try{d=await res.json()}catch{}throw Error(d.error||'HTTP '+res.status)}const reader=res.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const events=buffer.split('\n\n');buffer=events.pop()||'';for(const event of events){const line=event.split('\n').find(x=>x.startsWith('data:'));if(!line)continue;let d;try{d=JSON.parse(line.slice(5).trim())}catch{continue}if(d.token){full+=d.token;answer.body.textContent=full;chat.scrollTop=chat.scrollHeight}if(d.error)throw Error(d.error)}}if(!full)full='(AI không trả về nội dung)';history.push({role:'user',content:text||'(Đã gửi tệp đính kèm)'});history.push({role:'assistant',content:full})}catch(e){if(e.name==='AbortError'){answer.body.textContent=full||'Đã dừng yêu cầu.';if(full)history.push({role:'assistant',content:full})}else{answer.body.classList.add('error');answer.body.textContent='Lỗi: '+e.message}}finally{sendBtn.disabled=false;stopBtn.disabled=true;sendBtn.textContent='Gửi ↑';controller=null;prompt.focus()}}
sendBtn.onclick=send;stopBtn.onclick=()=>controller?.abort();prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#clearBtn').onclick=()=>{controller?.abort();chat.replaceChildren();history=[];const w=document.createElement('div');w.className='welcome';const h=document.createElement('h1');h.textContent='Chat mới';const p=document.createElement('div');p.textContent='Hãy gửi câu hỏi hoặc đính kèm tệp/ảnh.';w.append(h,p);chat.append(w)};check();loadModels();
</script></body></html>
