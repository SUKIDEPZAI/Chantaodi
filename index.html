<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090f"><title>MotAPI Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.hidden{display:none!important}

.comp{padding:8px 16px 12px}.box{max-width:860px;margin:auto;background:var(--p2);border:1px solid #ffffff1f;border-radius:18px;padding:10px;box-shadow:0 10px 36px #0006}.modes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:6px}.mode{border:1px solid transparent;background:none;border-radius:8px;padding:4px 10px;font-size:12px;color:var(--mu)}.mode.on{background:#a99bff22;border-color:#a99bff55;color:#e0dafe}.sw{margin-left:auto;font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}.sw input{accent-color:var(--ac)}

.bar{display:flex;gap:7px;align-items:center;padding-top:6px;border-top:1px solid #ffffff0d}.send{margin-left:auto;border:0;border-radius:11px;padding:8px 16px;font-weight:700;color:#10132a;background:linear-gradient(110deg,#b3a6ff,#86e6e0)}.send:disabled{opacity:.5}.hint{text-align:center;color:#66738f;font-size:11px;margin-top:7px}
.panel{background:var(--p1);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-width:0;overflow:hidden}.ph{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--ln)}.ph b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.tab.on{background:#a99bff22;border-color:#a99bff55;color:#fff}
.pv{flex:1;min-height:0;position:relative;background:#fff}.pv iframe{width:100%;height:100%;border:0;background:#fff}.pc{flex:1;min-height:0;overflow:auto;margin:0;padding:14px;font:12.5px/1.6 var(--m);background:#080b13}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#232c43;border:1px solid var(--ln);border-radius:10px;padding:9px 14px;font-size:12px;z-index:50}

.ws{border-top:1px solid var(--ln);padding-top:8px;max-height:40%;display:flex;flex-direction:column;min-height:0}.ws summary{cursor:pointer;font-weight:600;font-size:13px}.wsbar{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.wsbar .btn{padding:4px 8px;font-size:11px}.wsl{overflow:auto;min-height:0}.wf{display:flex;align-items:center;gap:4px;font-size:12px;padding:3px 2px}.wf .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b4bfd6}.wf button{border:0;background:none;color:var(--mu);padding:1px 4px}.wf input{accent-color:var(--ac)}.acts select.btn{background:var(--p2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app" id="app">
<aside class="side" id="side"><div class="brand"><div class="logo">✦</div>MotAPI Studio</div><button class="btn new" id="newChat">＋ Cuộc trò chuyện mới</button><input class="search" id="q" placeholder="Tìm trong lịch sử…"><div class="hist" id="hist"></div><details class="ws" id="ws"><summary>📁 Tệp <span id="wsn">0</span></summary><div class="wsbar"><label class="btn" for="wsin">Tải lên / giải nén</label><input type="file" id="wsin" multiple hidden><button class="btn" id="wsZip">.zip</button><button class="btn" id="wsClr">Xóa hết</button></div><div class="wsl" id="wsl"></div></details><div class="st" id="sideSt">Đang kiểm tra…</div></aside>

<section class="chat" id="chat"><div class="welcome" id="welcome"><div class="logo" style="width:60px;height:60px;font-size:28px;border-radius:20px;margin-bottom:18px">✦</div><h1>Bạn muốn làm gì hôm nay?</h1><p>Hỏi đáp, nghiên cứu web, viết code có xem trước, phân tích tệp và xuất file khi bạn yêu cầu.</p>
<div class="cards"><button class="card" data-p="Tìm thông tin mới nhất về AI, tóm tắt và dẫn nguồn." data-m="research"><b>Nghiên cứu web</b><span>Tìm, đối chiếu và dẫn nguồn</span></button><button class="card" data-p="Tạo một trang landing page HTML đẹp cho quán cà phê, một tệp duy nhất." data-m="coding"><b>Viết code &amp; xem trước</b><span>HTML chạy ngay trong khung xem</span></button><button class="card" data-p="Viết báo cáo kế hoạch marketing 1 trang và xuất ra file Word (.docx)."><b>Tạo &amp; xuất file</b><span>Word, Excel, PDF, Markdown…</span></button><button class="card" data-p="Phân tích tệp tôi đính kèm, nêu cấu trúc, lỗi và cách cải thiện."><b>Phân tích tệp</b><span>Tài liệu, code, ảnh</span></button></div></div>
<div class="msgs hidden" id="msgs"></div></section>
<div class="comp"><div class="box" id="box"><div class="modes"><button class="mode on" data-mode="chat">Chat</button><button class="mode" data-mode="research">Research</button><button class="mode" data-mode="coding">Coding</button><label class="sw"><input type="checkbox" id="web"> Tìm kiếm web</label></div><div class="chips" id="chips"></div><textarea id="prompt" rows="1" placeholder="Nhắn cho AI… (Enter gửi, Shift+Enter xuống dòng, dán hoặc kéo thả tệp)"></textarea><div class="bar"><label class="btn" for="fin">＋ Đính kèm</label><input type="file" id="fin" multiple hidden><button class="btn" id="mic" title="Nhập bằng giọng nói">🎤</button><button class="btn" id="cust" title="Hướng dẫn tùy chỉnh cho AI">Hướng dẫn</button><button class="btn" id="expChat">Xuất chat</button><button class="btn hidden" id="stop">■ Dừng</button><button class="send" id="send">Gửi ↑</button></div></div><div class="hint">Khối “suy nghĩ” là bản tóm tắt cách làm, không phải toàn bộ suy luận nội bộ. Hãy kiểm tra thông tin quan trọng.</div></div></main>
<aside class="panel hidden" id="panel"><div class="ph"><b id="pt">Tệp</b><button class="btn tab" id="tPv">Xem trước</button><button class="btn tab" id="tCode">Code</button><button class="btn" id="pCopy">Sao chép</button><button class="btn" id="pDl">Tải</button><button class="btn" id="pNew" title="Mở tab mới">↗</button><button class="btn" id="pClose">✕</button></div><div class="pv" id="pv"><iframe id="frame" sandbox="allow-scripts allow-modals" title="Xem trước"></iframe></div><pre class="pc hidden" id="pc"></pre></aside>
</div><div class="toast hidden" id="toast"></div>
<script>
const SID=(()=>{let s=localStorage.getItem('motapiSid');if(!s){s='s'+crypto.randomUUID().replace(/-/g,'');localStorage.setItem('motapiSid',s)}return s})();
/* mật khẩu truy cập (nếu máy chủ đặt APP_PASSWORD) */
const _f=window.fetch.bind(window);window.fetch=async(u,o={})=>{const go=()=>{if(typeof u==='string'&&u.startsWith('/api/')){const h=new Headers(o.headers||{});h.set('X-App-Password',localStorage.getItem('motapiPw')||'');h.set('X-Session',SID);o={...o,headers:h}}return _f(u,o)};let r=await go();if(r.status===401&&typeof u==='string'&&u.startsWith('/api/')){const pw=window.prompt('Nhập mật khẩu truy cập:');if(pw){localStorage.setItem('motapiPw',pw);r=await go()}}return r};
const $=s=>document.querySelector(s),chat=$('#chat'),msgs=$('#msgs'),prompt_=$('#prompt'),modelEl=$('#model');
let mode='chat',files=[],history=[],ctl=null,title='Cuộc trò chuyện mới',chats=[],lastPrompt='',cur=null,chatId=nid();
const FB=['gpt-6-astra','claude-sonnet-5-5','claude-sonnet-4-6','deepseek-v4-flash','gpt-6-sol','grok-4.6','qwen3.8-max','minimax-m3'];
function nid(){return 'c-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2400)}
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- Markdown ---------- */
function inl(t){return t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function mdBlock(txt){const L=esc(txt).split('\n');let o='',lst=null,tb=[];const eL=()=>{if(lst){o+='</'+lst+'>';lst=null}},eT=()=>{if(!tb.length)return;const rows=tb.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim())));o+='<div class="tw"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?'<td>'+c+'</td>':'<th>'+c+'</th>').join('')+'</tr>').join('')+'</table></div>';tb=[]};
for(const l of L){let m;if(/^\s*\|.*\|\s*$/.test(l)){eL();tb.push(l);continue}eT();
if(m=l.match(/^(#{1,3}) (.+)/)){eL();o+='<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>'}
else if(m=l.match(/^\s*[-*] (.+)/)){if(lst!=='ul'){eL();o+='<ul>';lst='ul'}o+='<li>'+inl(m[1])+'</li>'}
else if(m=l.match(/^\s*\d+\. (.+)/)){if(lst!=='ol'){eL();o+='<ol>';lst='ol'}o+='<li>'+inl(m[1])+'</li>'}
else if(m=l.match(/^&gt; ?(.*)/)){eL();o+='<blockquote>'+inl(m[1])+'</blockquote>'}
else if(/^-{3,}$/.test(l.trim())){eL();o+='<hr>'}
else if(!l.trim())eL();else{eL();o+='<p>'+inl(l)+'</p>'}}
eL();eT();return o}
const PV=['html','htm','svg','md','markdown'];
function parse(raw){let think='',text=raw;const m=text.match(/<think>([\s\S]*?)(<\/think>|$)/);if(m){think=m[1].trim();text=text.replace(m[0],'')}
const blocks=[],re=/```([^\n`]*)\n([\s\S]*?)(```|$)/g;let html='',last=0,x;
while((x=re.exec(text))){html+=mdBlock(text.slice(last,x.index));const info=x[1].trim(),code=x[2].replace(/\n$/,''),fm=info.match(/^file:(\S+)/),i=blocks.length;
const b={name:fm?fm[1]:'',lang:fm?fm[1].split('.').pop().toLowerCase():info.toLowerCase().split(/\s/)[0],code,file:!!fm};blocks.push(b);
if(b.file)html+='<div class="file"><div class="ic">📄</div><div class="nm">'+esc(b.name)+'<small>'+b.code.length.toLocaleString()+' ký tự</small></div>'+(PV.includes(b.lang)?'<button class="btn" data-a="open" data-i="'+i+'">Xem</button>':'')+'<button class="btn" data-a="ws" data-i="'+i+'">Lưu vào tệp</button><button class="btn" data-a="dl" data-i="'+i+'">Tải xuống</button></div>';
else html+='<div class="cb"><div class="ch"><span>'+esc(b.lang||'code')+'</span><span class="sp"></span><button data-a="copy" data-i="'+i+'">Sao chép</button><button data-a="dl" data-i="'+i+'">Tải</button><button data-a="open" data-i="'+i+'">'+(PV.includes(b.lang)?'Xem trước':'Mở')+'</button></div><pre><code>'+esc(code)+'</code></pre></div>';
last=re.lastIndex;if(!x[3])break}
html+=mdBlock(text.slice(last));return{think,html,blocks,plain:text.trim()}}
/* ---------- Export ---------- */
const MIME={html:'text/html',json:'application/json',csv:'text/csv',svg:'image/svg+xml',md:'text/markdown'};
function dl(data,name,type){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:(type||'text/plain')+';charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
const EXT={python:'py',javascript:'js',typescript:'ts',bash:'sh',markdown:'md',yaml:'yml',htm:'html'};
const wrapHtml=(t,body)=>'<!doctype html><meta charset="utf-8"><title>'+esc(t)+'</title><style>body{font:16px/1.7 system-ui;max-width:780px;margin:40px auto;padding:0 18px;color:#111}pre{background:#f4f4f6;padding:12px;overflow:auto}code{font-family:ui-monospace,monospace}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px 10px}</style>'+body;
async function exportAs(fmt,content,name){name=(name||'tai-lieu').replace(/\.[^.]+$/,'');
try{if(['docx','xlsx','pptx','rtf'].includes(fmt)){const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format:fmt,title:name,content:fmt==='xlsx'?tbl2csv(content):content})});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'HTTP '+r.status)}return dl(await r.blob(),name+'.'+fmt)}
if(fmt==='pdf'){const w=window.open('','_blank');if(!w)return toast('Trình duyệt chặn cửa sổ mới. Hãy cho phép rồi thử lại.');w.document.write(wrapHtml(name,parse(content).html));w.document.close();setTimeout(()=>w.print(),400);return toast('Chọn “Lưu dưới dạng PDF” trong hộp thoại in')}
if(fmt==='html')return dl(wrapHtml(name,parse(content).html),name+'.html','text/html');
dl(content,name+'.'+fmt,MIME[fmt])}catch(e){toast('Xuất thất bại: '+e.message)}}
function dlBlock(b){const ext=b.file?b.name.split('.').pop().toLowerCase():(EXT[b.lang]||b.lang||'txt'),name=b.name||('code.'+ext);if(b.file&&['docx','xlsx','pptx','rtf','pdf'].includes(ext))return exportAs(ext,b.code,b.name);dl(b.code,name,MIME[ext])}
/* ---------- Panel ---------- */
let pb=null;
function openPanel(b){pb=b;$('#panel').classList.remove('hidden');$('#app').classList.add('panel-open');$('#pt').textContent=b.name||('Code · '+(b.lang||'text'));$('#pc').textContent=b.code;const pv=PV.includes(b.lang);$('#tPv').classList.toggle('hidden',!pv);if(pv)setTab('pv');else setTab('code');if(pv){const h=b.lang==='md'||b.lang==='markdown'?wrapHtml(b.name||'md',parse(b.code).html):(b.lang==='svg'?'<body style="margin:0;display:grid;place-items:center;min-height:100vh">'+b.code:b.code);$('#frame').srcdoc=h}}
function setTab(t){$('#pv').classList.toggle('hidden',t!=='pv');$('#pc').classList.toggle('hidden',t!=='code');$('#tPv').classList.toggle('on',t==='pv');$('#tCode').classList.toggle('on',t==='code')}
$('#tPv').onclick=()=>setTab('pv');$('#tCode').onclick=()=>setTab('code');$('#pClose').onclick=()=>{$('#panel').classList.add('hidden');$('#app').classList.remove('panel-open');$('#frame').srcdoc=''};
$('#pCopy').onclick=()=>pb&&navigator.clipboard.writeText(pb.code).then(()=>toast('Đã sao chép'),()=>toast('Không sao chép được'));$('#pDl').onclick=()=>pb&&dlBlock(pb);
$('#pNew').onclick=()=>{if(!pb)return;const w=window.open('','_blank');if(w){w.document.write(PV.includes(pb.lang)?$('#frame').srcdoc:'<pre>'+esc(pb.code)+'</pre>');w.document.close()}};
msgs.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const m=t.closest('.m'),b=m&&m._blocks&&m._blocks[+t.dataset.i];if(!b)return;if(t.dataset.a==='copy')navigator.clipboard.writeText(b.code).then(()=>toast('Đã sao chép'),()=>toast('Không sao chép được'));else if(t.dataset.a==='dl')dlBlock(b);else if(t.dataset.a==='ws')wsSave(b);else openPanel(b)});
/* ---------- Messages ---------- */
function addUser(t){$('#welcome').classList.add('hidden');msgs.classList.remove('hidden');const d=document.createElement('div');d.className='m user';d.textContent=t;msgs.append(d);scroll()}
function scroll(){const n=chat.scrollHeight-chat.scrollTop-chat.clientHeight<160;if(n||scroll.f)chat.scrollTop=chat.scrollHeight;scroll.f=false}
function addAI(model){$('#welcome').classList.add('hidden');msgs.classList.remove('hidden');const d=document.createElement('div');d.className='m ai';d.innerHTML='<div class="meta">MotAPI AI · '+esc(model||'')+'</div><details class="think run hidden" open><summary><span class="dot"></span><span class="tl">Đang suy nghĩ…</span></summary><div class="tb"></div></details><div class="txt"></div><div class="acts hidden"></div>';msgs.append(d);scroll.f=true;scroll();return{el:d,th:d.querySelector('.think'),tl:d.querySelector('.tl'),tb:d.querySelector('.tb'),txt:d.querySelector('.txt'),acts:d.querySelector('.acts'),t0:Date.now()}}
function actions(a,plain,blocks){a.acts.classList.remove('hidden');a.acts.replaceChildren();const mk=(l,f)=>{const b=document.createElement('button');b.className='btn';b.textContent=l;b.onclick=f;a.acts.append(b)};
mk('Sao chép',()=>navigator.clipboard.writeText(plain).then(()=>toast('Đã sao chép'),()=>toast('Không sao chép được')));mk('Tạo lại',regen);
{const s=document.createElement('select');s.className='btn';s.innerHTML='<option value="">Xuất file…</option>'+['md','txt','html','docx','pptx','xlsx','rtf','pdf','json','csv'].map(f=>'<option>'+f+'</option>').join('');s.onchange=()=>{if(s.value)exportAs(s.value,plain,title.slice(0,40));s.value=''};a.acts.append(s)}
if(blocks.some(b=>!b.file)&&blocks.length)mk('Tải tất cả code',()=>blocks.filter(b=>!b.file).forEach((b,i)=>setTimeout(()=>dlBlock(b),i*250)))}
function paint(a,raw,steps,final,finished){const p=parse(raw);a.el._blocks=p.blocks;a.txt.innerHTML=p.html;const sec=Math.max(1,Math.round((Date.now()-a.t0)/1000));
const hasT=!!p.think,show=hasT||steps.length;a.th.classList.toggle('hidden',!show);if(show){a.tb.textContent=hasT?p.think:steps.map((s,i)=>(i+1)+'. '+s).join('\n');const thinking=!finished&&!p.html.replace(/<[^>]+>/g,'').trim();a.th.classList.toggle('run',thinking);a.tl.textContent=thinking?'Đang suy nghĩ… '+sec+'s':(hasT?'Đã suy nghĩ trong '+(a.tSec||sec)+'s':'Tiến trình xử lý');if(!thinking&&!a.tSec){a.tSec=sec;if(!final)a.th.open=false}}
if(final){a.th.classList.remove('run');a.th.open=false;actions(a,p.plain||raw,p.blocks)}scroll()}
/* ---------- Send ---------- */
async function send(){const text=prompt_.value.trim();if(!text&&!files.length)return;if(ctl)return toast('Đang xử lý. Hãy đợi hoặc bấm Dừng.');
const chosen=files.slice(),model=modelEl.value,search=$('#web').checked||mode==='research',ut=text||('(Đã gửi tệp: '+chosen.map(f=>f.name).join(', ')+')');lastPrompt=ut;
if(!history.length){title=ut.slice(0,48);$('#title').textContent=title}history.push({role:'user',content:ut});addUser(ut);const a=addAI(model);cur=a;history.push({role:'assistant',content:'…'});save();
prompt_.value='';size();files=[];chips();$('#send').disabled=true;$('#stop').classList.remove('hidden');ctl=new AbortController();
let think='',ans='',steps=[],raf=0,fin=false;const full=()=>(think?'<think>'+think+'</think>':'')+ans,draw=()=>{raf=0;paint(a,full(),steps,false,false)},tick=setInterval(()=>{if(!ans)paint(a,full(),steps,false,false)},1000);
try{const fd=new FormData();fd.append('message',text);fd.append('model',model);fd.append('mode',mode);fd.append('custom',localStorage.getItem('motapiCustom')||'');fd.append('ws',JSON.stringify([...sel]));sel.clear();setTimeout(wsRefresh,0);fd.append('web_search',String(search));
fd.append('history',JSON.stringify(history.slice(0,-2).slice(-20).map(m=>({role:m.role,content:m.content.replace(/<think>[\s\S]*?(<\/think>|$)/g,'').trim()}))));chosen.forEach(f=>fd.append('files',f));
const r=await fetch('/api/chat',{method:'POST',body:fd,signal:ctl.signal});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'HTTP '+r.status)}
const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
while(true){const{value,done}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ps=buf.replace(/\r\n/g,'\n').split('\n\n');buf=ps.pop()||'';
for(const p of ps){const l=p.split('\n').find(x=>x.startsWith('data:'));if(!l)continue;let d;try{d=JSON.parse(l.slice(5).trim())}catch{continue}
if(d.status)steps.push(d.status);if(d.think)think+=d.think;if(d.token)ans+=d.token;if(d.error)throw Error(d.error);
if(!raf)raf=requestAnimationFrame(draw);if(d.token){history[history.length-1].content=full()}}}
fin=true;if(!ans&&!think)ans='(AI không trả về nội dung)';steps.push('Hoàn tất. Hãy kiểm tra dữ kiện và mã nguồn trước khi dùng.');paint(a,full(),steps,true,true);history[history.length-1].content=full();save()}
catch(e){const ab=e.name==='AbortError',msg=ab?(ans?'Đã dừng. Phần đã tạo được lưu.':'Đã dừng yêu cầu.'):'Lỗi: '+e.message;paint(a,full(),steps,false,true);if(ans)a.txt.insertAdjacentHTML('beforeend','<p class="err">'+esc(msg)+'</p>');else a.txt.innerHTML='<p class="err">'+esc(msg)+'</p>';a.th.classList.remove('run');actions(a,ans||msg,parse(ans).blocks);history[history.length-1].content=(full()||'')+(full()?'\n\n':'')+'['+msg+']';save()}
finally{clearInterval(tick);cancelAnimationFrame(raf);$('#send').disabled=false;$('#stop').classList.add('hidden');ctl=null;prompt_.focus()}}
function regen(){if(ctl||history.length<2)return toast('Chưa thể tạo lại lúc này.');history.splice(-2);msgs.lastElementChild.remove();msgs.lastElementChild.remove();prompt_.value=lastPrompt;send()}
/* ---------- History ---------- */
function save(){if(!history.length)return;const c={id:chatId,title,history:history.slice(),model:modelEl.value,mode,updated:Date.now()},i=chats.findIndex(x=>x.id===chatId);if(i>=0)chats[i]=c;else chats.unshift(c);chats=chats.slice(0,60);try{localStorage.setItem('motapiStudioChats',JSON.stringify(chats))}catch{toast('Bộ nhớ trình duyệt đầy. Hãy xuất chat để sao lưu.')}rh()}
function rh(){const el=$('#hist'),q=$('#q').value.toLowerCase();el.replaceChildren();chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.history.some(m=>m.content.toLowerCase().includes(q))).forEach(c=>{const d=document.createElement('div');d.className='hi'+(c.id===chatId?' on':'');d.innerHTML='<span></span><button title="Xóa">✕</button>';d.firstChild.textContent=c.title;d.onclick=ev=>{if(ev.target.tagName==='BUTTON'){chats=chats.filter(x=>x.id!==c.id);localStorage.setItem('motapiStudioChats',JSON.stringify(chats));if(c.id===chatId)newChat(true);return rh()}openChat(c)};el.append(d)})}
function openChat(c){if(ctl)ctl.abort();chatId=c.id;history=c.history.slice();title=c.title;$('#title').textContent=title;modelEl.value=c.model||modelEl.value;setMode(c.mode||'chat');msgs.replaceChildren();$('#welcome').classList.add('hidden');msgs.classList.remove('hidden');
for(const m of history){if(m.role==='user')addUser(m.content);else{const a=addAI(c.model);const p=parse(m.content);a.th.open=false;paint(a,m.content,[],true,true);a.tl.textContent=p.think?'Đã suy nghĩ':'Tiến trình xử lý'}}$('#side').classList.remove('open');rh();scroll.f=true;scroll()}
function newChat(skip){if(ctl)ctl.abort();if(!skip)save();history=[];chatId=nid();files=[];chips();title='Cuộc trò chuyện mới';$('#title').textContent=title;msgs.replaceChildren();msgs.classList.add('hidden');$('#welcome').classList.remove('hidden');prompt_.value='';$('#side').classList.remove('open');rh()}
/* ---------- UI wiring ---------- */
function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));if(m==='research')$('#web').checked=true}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{prompt_.value=b.dataset.p;if(b.dataset.m)setMode(b.dataset.m);size();prompt_.focus()});
function size(){prompt_.style.height='auto';prompt_.style.height=Math.min(prompt_.scrollHeight,200)+'px'}prompt_.oninput=size;prompt_.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
function chips(){const c=$('#chips');c.replaceChildren();files.forEach((f,i)=>{const s=document.createElement('span');s.className='chip';if(f.type.startsWith('image/')){const im=document.createElement('img');im.src=URL.createObjectURL(f);s.append(im)}s.append(f.name);const b=document.createElement('button');b.textContent='×';b.onclick=()=>{files.splice(i,1);chips()};s.append(b);c.append(s)})}
const ARC=/\.(zip|tar|tgz|gz|bz2|xz|7z|rar|tbz2|txz)$/i;const addF=l=>{const a=l.filter(f=>ARC.test(f.name));if(a.length)wsUpload(a);files.push(...l.filter(f=>!ARC.test(f.name)));chips()};$('#fin').onchange=e=>{addF([...e.target.files]);e.target.value=''};
prompt_.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])];if(f.length){e.preventDefault();addF(f)}});
['dragover','drop'].forEach(n=>$('#box').addEventListener(n,e=>{e.preventDefault();if(n==='drop')addF([...e.dataTransfer.files])}));
$('#send').onclick=send;$('#stop').onclick=()=>ctl&&ctl.abort();$('#newChat').onclick=()=>newChat();$('#q').oninput=rh;$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#expChat').onclick=()=>{if(!history.length)return toast('Chưa có nội dung để xuất');dl('# '+title+'\n\n'+history.map(m=>(m.role==='user'?'**Bạn:**':'**AI:**')+'\n\n'+m.content.replace(/<think>[\s\S]*?<\/think>/g,'').trim()).join('\n\n---\n\n'),'cuoc-tro-chuyen.md','text/markdown')};
$('#testApi').onclick=async()=>{const b=$('#testApi');b.disabled=true;b.textContent='Đang thử…';try{const r=await fetch('/api/diagnostics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:modelEl.value})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'HTTP '+r.status);toast('API hoạt động · '+d.model);$('#st').textContent='● API hoạt động';$('#st').style.color='var(--mn)'}catch(e){toast('Kiểm tra API thất bại: '+e.message);$('#st').textContent='● Lỗi API';$('#st').style.color='var(--bad)'}finally{b.disabled=false;b.textContent='Kiểm tra API'}};
async function init(){try{chats=JSON.parse(localStorage.getItem('motapiStudioChats')||'[]')}catch{chats=[]}rh();
try{const d=await(await fetch('/api/health')).json();$('#st').textContent=d.configured?'● Sẵn sàng':'● Thiếu API key';if(!d.configured)$('#st').style.color='var(--bad)';$('#sideSt').textContent=d.search_configured?'API + tìm kiếm web':'Chưa cấu hình tìm kiếm'}catch{$('#st').textContent='● Không kết nối';$('#sideSt').textContent='Không kết nối'}
let list=FB;try{const d=await(await fetch('/api/models')).json(),l=(d.models||[]).map(x=>typeof x==='string'?x:x.id).filter(Boolean);if(l.length)list=l}catch{}
list.forEach(id=>{const o=document.createElement('option');o.value=o.textContent=id;modelEl.append(o)});modelEl.value=list.includes('gpt-6-astra')?'gpt-6-astra':list[0]}
$('#cust').onclick=()=>{const v=window.prompt('Hướng dẫn tùy chỉnh (giọng điệu, vai trò, định dạng…). Để trống để xóa:',localStorage.getItem('motapiCustom')||'');if(v!==null){localStorage.setItem('motapiCustom',v.slice(0,2000));toast(v?'Đã lưu hướng dẫn':'Đã xóa hướng dẫn')}};
$('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Trình duyệt chưa hỗ trợ nhập giọng nói.');const r=new SR();r.lang='vi-VN';r.interimResults=false;r.onresult=e=>{prompt_.value+=(prompt_.value?' ':'')+e.results[0][0].transcript;size()};r.onerror=()=>toast('Không nhận được giọng nói.');r.onend=()=>$('#mic').textContent='🎤';$('#mic').textContent='●';r.start()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();newChat()}if(e.key==='Escape'&&!$('#panel').classList.contains('hidden'))$('#pClose').click()});
const sel=new Set(),tbl2csv=t=>{const r=t.split('\n').filter(l=>/^\s*\|.*\|\s*$/.test(l)&&!/^\s*\|[\s:|-]+\|\s*$/.test(l));return r.length?r.map(x=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>'"'+c.trim().replace(/"/g,'""')+'"').join(',')).join('\n'):t};
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function wsRefresh(){try{const d=await(await fetch('/api/files/list')).json(),l=$('#wsl');$('#wsn').textContent=d.files.length;l.replaceChildren();d.files.forEach(f=>{const r=document.createElement('div');r.className='wf';r.innerHTML='<input type="checkbox" title="Đính kèm vào tin nhắn tiếp theo"><span class="n"></span><button title="Xem">👁</button><button title="Tải">⬇</button><button title="Xóa">✕</button>';const c=r.children;c[0].checked=sel.has(f.path);c[0].onchange=()=>c[0].checked?sel.add(f.path):sel.delete(f.path);c[1].textContent=f.path;c[1].title=f.path+' · '+kb(f.size);
c[2].onclick=async()=>{const x=await fetch('/api/files/read?path='+encodeURIComponent(f.path)),j=await x.json();if(!x.ok)return toast(j.error||'Không xem được');openPanel({name:f.path,lang:f.path.split('.').pop().toLowerCase(),code:j.text})};
c[3].onclick=async()=>{const x=await fetch('/api/files/download?path='+encodeURIComponent(f.path));x.ok?dl(await x.blob(),f.path.split('/').pop()):toast('Không tải được')};
c[4].onclick=async()=>{await fetch('/api/files?path='+encodeURIComponent(f.path),{method:'DELETE'});sel.delete(f.path);wsRefresh()};l.append(r)})}catch{}}
async function wsUpload(list){const fd=new FormData();[...list].forEach(f=>fd.append('files',f));toast('Đang tải lên…');try{const r=await fetch('/api/files/upload',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error||'HTTP '+r.status);toast((d.notes||[]).join(' ')||'Đã thêm '+d.added+' tệp');$('#ws').open=true;wsRefresh()}catch(e){toast('Tải lên thất bại: '+e.message)}}
async function wsSave(b){const nm=b.name||('code.'+(EXT[b.lang]||b.lang||'txt'));try{const r=await fetch('/api/files/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:nm,content:b.code})}),d=await r.json();if(!r.ok)throw Error(d.error);toast('Đã lưu: '+d.path);wsRefresh()}catch(e){toast(e.message||'Không lưu được')}}
$('#wsin').onchange=e=>{wsUpload(e.target.files);e.target.value=''};
$('#wsZip').onclick=async()=>{const x=await fetch('/api/files/zip');x.ok?dl(await x.blob(),'workspace.zip'):toast('Không tạo được zip')};
$('#wsClr').onclick=async()=>{if(window.confirm('Xóa toàn bộ tệp trong workspace?')){await fetch('/api/files?all=1',{method:'DELETE'});sel.clear();wsRefresh()}};
wsRefresh();init();
</script></body></html>
